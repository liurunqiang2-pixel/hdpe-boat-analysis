<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HDPE Ship Design Workbench</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-alt: #1f2937;
        --border: rgba(148, 163, 184, 0.2);
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent-2: #22c55e;
        --warning: #f59e0b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: linear-gradient(135deg, #020817 0%, #0f172a 40%, #111827 100%);
        color: var(--text);
        font-family: Inter, Arial, sans-serif;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 40px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 24px;
      }
      .title {
        font-size: clamp(1.8rem, 3vw, 2.8rem);
        font-weight: 700;
        margin: 0;
      }
      .badge {
        border: 1px solid var(--border);
        background: rgba(56, 189, 248, 0.08);
        color: var(--accent);
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 0.8rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .grid {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }
      .panel {
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.35);
      }
      .stat {
        padding: 22px 20px;
      }
      .label {
        color: var(--muted);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .value {
        margin-top: 8px;
        font-size: 2rem;
        font-weight: 700;
      }
      .content {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 20px;
        margin-top: 24px;
      }
      .box {
        padding: 20px;
      }
      .box h2 {
        margin: 0 0 16px;
        font-size: 1.1rem;
      }
      form {
        display: grid;
        gap: 12px;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      input, select, textarea, button {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel-alt);
        color: var(--text);
        outline: none;
      }
      input:focus, select:focus, textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
      }
      button {
        background: linear-gradient(135deg, var(--accent), #2563eb);
        border: none;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: linear-gradient(135deg, var(--accent-2), #16a34a);
      }
      .list {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 12px 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.5);
      }
      .muted { color: var(--muted); }
      .small { font-size: 0.8rem; }
      .status {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 0.72rem;
        background: rgba(34, 197, 94, 0.12);
        color: #86efac;
      }
      @media (max-width: 900px) {
        .content { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1 class="title">HDPE Ship Design Workbench</h1>
        <span class="badge">prototype</span>
      </div>

      <div class="grid" id="stats"></div>

      <div class="content">
        <section class="panel box">
          <h2>New project</h2>
          <form id="projectForm">
            <label>
              Project code
              <input name="code" placeholder="HDPE-001" required />
            </label>
            <label>
              Project name
              <input name="name" placeholder="Blue Flag Hull Design" required />
            </label>
            <label>
              Description
              <textarea name="description" rows="3" placeholder="Hull concept and design notes"></textarea>
            </label>
            <button type="submit">Create project</button>
          </form>

          <h2 style="margin-top: 28px;">New material</h2>
          <form id="materialForm">
            <label>
              Code
              <input name="code" placeholder="HDPE-PE100" required />
            </label>
            <label>
              Name
              <input name="name" placeholder="Marine grade PE100" required />
            </label>
            <label>
              Material family
              <input name="material_family" value="HDPE" />
            </label>
            <button class="secondary" type="submit">Create material</button>
          </form>
        </section>

        <aside class="panel box">
          <h2>Project list</h2>
          <div id="projectsList" class="list"></div>

          <h2 style="margin-top: 24px;">Material list</h2>
          <div id="materialsList" class="list"></div>
        </aside>
      </div>
    </div>

    <script>
      const apiBase = '/api/v1';

      async function fetchJson(url, options = {}) {
        const res = await fetch(url, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            ...(options.headers || {}),
          },
        });
        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || 'Request failed');
        }
        return res.json();
      }

      function renderStats(stats) {
        const cards = [
          { label: 'Projects', value: stats.projects_count ?? 0 },
          { label: 'Materials', value: stats.materials_count ?? 0 },
          { label: 'Parts', value: stats.parts_count ?? 0 },
          { label: 'Analyses', value: stats.analyses_count ?? 0 },
        ];

        document.getElementById('stats').innerHTML = cards.map(card => `
          <div class="panel stat">
            <div class="label">${card.label}</div>
            <div class="value">${card.value}</div>
          </div>
        `).join('');
      }

      function renderProjects(projects) {
        const list = document.getElementById('projectsList');
        list.innerHTML = projects.length
          ? projects.map(project => `
              <div class="row">
                <div>
                  <div>${project.name}</div>
                  <div class="small muted">${project.code}</div>
                </div>
                <span class="status">${project.status}</span>
              </div>
            `).join('')
          : '<div class="muted small">No projects yet.</div>';
      }

      function renderMaterials(materials) {
        const list = document.getElementById('materialsList');
        list.innerHTML = materials.length
          ? materials.map(material => `
              <div class="row">
                <div>
                  <div>${material.name}</div>
                  <div class="small muted">${material.code}</div>
                </div>
                <span class="status">${material.certified ? 'certified' : 'draft'}</span>
              </div>
            `).join('')
          : '<div class="muted small">No materials yet.</div>';
      }

      async function loadDashboard() {
        const [projects, materials] = await Promise.all([
          fetchJson(`${apiBase}/projects`),
          fetchJson(`${apiBase}/materials`),
        ]);

        renderProjects(projects);
        renderMaterials(materials);
        renderStats({
          projects_count: projects.length,
          materials_count: materials.length,
          parts_count: 0,
          analyses_count: 0,
        });
      }

      document.getElementById('projectForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const payload = Object.fromEntries(form.entries());
        payload.status = 'draft';
        await fetchJson(`${apiBase}/projects`, { method: 'POST', body: JSON.stringify(payload) });
        event.currentTarget.reset();
        loadDashboard();
      });

      document.getElementById('materialForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const payload = Object.fromEntries(form.entries());
        payload.certified = true;
        await fetchJson(`${apiBase}/materials`, { method: 'POST', body: JSON.stringify(payload) });
        event.currentTarget.reset();
        loadDashboard();
      });

      loadDashboard();
    </script>
  </body>
</html>
